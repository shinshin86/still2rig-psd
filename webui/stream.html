<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>キャラクターの配信画面</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; }
      #error { position: absolute; left: 12px; right: 12px; bottom: 12px; margin: 0; padding: 8px; color: #fff; background: #252c3c; font: 13px/1.5 sans-serif; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="avatar" aria-label="配信用のキャラクター"></canvas>
    <p id="error" role="status" hidden></p>
    <script src="./rigger.js"></script>
    <script type="module" src="./src/stream.ts"></script>
  </body>
</html>
